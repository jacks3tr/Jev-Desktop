name: Bug report
description: Something behaved differently from what the documentation says
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security issues through [private vulnerability reporting](https://github.com/jacks3tr/jev-desktop/security/advisories/new).

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit you are running
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Affected area
      options:
        - Offline engine (tests/unit, no desktop)
        - Live desktop (tests/windows, native driver)
        - Application compatibility
        - Transport (MCP stdio or the JSON CLI)
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `jev-desktop doctor`
      description: Remove credentials, access tokens, and private paths before posting.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Include the run result if there is one, especially execution, verdict, and reason.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The specification you used, the commands you ran, and anything unusual about the desktop or the application.
    validations:
      required: true
