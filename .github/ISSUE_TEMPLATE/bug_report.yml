name: Bug report
description: Something behaved differently from what the documentation says
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for anything security-relevant. Input escaping its scope, a
        guard bypass, journal replay, or a path escape belongs in the private process
        described in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0, or the commit you are running
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Which test tier does this involve
      options:
        - Offline engine (tests/unit, no desktop)
        - Live desktop (tests/windows, driver, fixture)
        - Real application, not the fixture
        - Transport (MCP stdio or the JSON CLI)
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `jev-desktop doctor`
      description: Paste it as-is. It contains the pipe name, driver health, policy state, and evidence usage.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Include the run result if there is one, especially execution, verdict, and reason.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The specification you used, the commands you ran, and anything unusual about the desktop or the application.
    validations:
      required: true
