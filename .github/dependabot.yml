version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["comtypes", "httpx", "mcp"]
      python-dev:
        patterns: ["pytest*", "ruff", "mypy", "build"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
