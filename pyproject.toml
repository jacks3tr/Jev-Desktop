[project]
name = "jev-desktop"
version = "0.1.0"
description = "Use Windows applications through MCP and the command line with Jev Desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "jacks3tr", email = "54018717+jacks3tr@users.noreply.github.com" }]
keywords = ["automation", "ui-automation", "desktop", "windows", "mcp", "typesafe", "jev", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
    "Typing :: Typed",
]
dependencies = [
    "comtypes>=1.4.16,<2",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=2.3,<3",
    "pytest>=8,<10",
    "ruff>=0.16,<0.17",
    "twine>=5,<7",
]

[project.scripts]
jev-desktop = "jev_desktop.transports.cli:main"

[project.urls]
Homepage = "https://github.com/jacks3tr/jev-desktop"
Repository = "https://github.com/jacks3tr/jev-desktop"
Documentation = "https://github.com/jacks3tr/jev-desktop/tree/main/docs"
Issues = "https://github.com/jacks3tr/jev-desktop/issues"
Releases = "https://github.com/jacks3tr/jev-desktop/releases"
Security = "https://github.com/jacks3tr/jev-desktop/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_desktop"]

[tool.hatch.build.targets.sdist]
include = [
    "/.codex-plugin",
    "/.mcp.json",
    "/src",
    "/tests",
    "/scripts",
    "/skills",
    "/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "windows: requires a live interactive Windows desktop session",
    "live: performs real input; gated behind JEV_DESKTOP_LIVE=1 and never part of unattended runs",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests and scripts adjust sys.path before importing the package, and keep long payloads.
"tests/**" = ["E402", "E501"]
"scripts/**" = ["E402", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["jev_desktop"]

[tool.mypy]
python_version = "3.12"
files = ["src/jev_desktop"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true
